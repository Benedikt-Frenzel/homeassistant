                name: Regen

  - title: Wartung
    path: wartung
    icon: mdi:tools
    type: sections
    max_columns: 2
    badges: []
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Gerätegesundheit
            heading_style: title
            icon: mdi:heart-pulse
          - type: markdown
            content: >
              {% set batt = states('sensor.wartung_batterie_warnungen') | int(0) %}
              {% set offline = states('sensor.wartung_geraete_offline') | int(0) %}
              # 🧰 Wartung

              {% if batt == 0 and offline == 0 %}
              **Alles unauffällig.** Keine Batterie-Warnungen und keine relevanten Offline-Geräte.
              {% else %}
              {% if batt > 0 %}**{{ batt }} Batterie-Warnung(en).** Details unten in der Liste.{% endif %}

              {% if offline > 0 %}**{{ offline }} Offline/unknown Gerät(e).** Details unten in der Liste.{% endif %}
              {% endif %}
          - type: tile
            entity: sensor.wartung_batterie_warnungen
            name: Batterie-Warnungen
            icon: mdi:battery-alert
            color: red
          - type: tile
            entity: sensor.wartung_geraete_offline
            name: Offline/unknown
            icon: mdi:access-point-off
            color: amber
          - type: entities
            title: Wartung Schwellen
            show_header_toggle: false
            entities:
              - entity: input_number.wartung_batterie_warnschwelle
                name: Batterie Warnschwelle
      - type: grid
        cards:
          - type: heading
            heading: Klima & Luft
            heading_style: title
            icon: mdi:air-filter
          - type: tile
            entity: sensor.wartung_luftqualitaet_status
            name: Luftqualität
            icon: mdi:air-filter
            color: purple
          - type: tile
            entity: sensor.wartung_feuchte_status
            name: Feuchte
            icon: mdi:water-percent-alert
            color: cyan
          - type: entities
            title: Einzelwerte
            show_header_toggle: false
            entities:
              - entity: sensor.luftfilter_schlafzimmer_pm25
                name: Schlafzimmer PM2.5
              - entity: sensor.luftfilter_wohnzimmer_pm25
                name: Wohnzimmer PM2.5
              - entity: sensor.haus_keller_luftfeuchte
                name: Keller Feuchte
              - entity: sensor.temp_feucht_bad_wanne_humidity
                name: Bad Feuchte
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Details
            heading_style: title
            icon: mdi:format-list-bulleted
          - type: markdown
            content: >
              ## Batterie

              {{ state_attr('sensor.wartung_batterie_warnungen','entities') }}

              ## Offline / unknown

              {{ state_attr('sensor.wartung_geraete_offline','entities') }}

  - title: Argus
    path: argus
    icon: mdi:monitor-dashboard
    type: sections
    max_columns: 2
    badges: []
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Monitoring Alerts
            heading_style: title
            icon: mdi:alarm-light-outline
          - type: tile
            entity: sensor.argus_alertmanager_status
            name: Status
            icon: mdi:alarm-light-outline
            color: red
          - type: tile
            entity: input_datetime.argus_last_alert_at
            name: Letzter Alert
            icon: mdi:clock-alert-outline
            color: blue
          - type: tile
            entity: counter.argus_page_alerts
            name: Page Alerts
            icon: mdi:alarm-light
            color: red
          - type: tile
            entity: counter.argus_warning_alerts
            name: Warnings
            icon: mdi:alert-outline
            color: amber
      - type: grid
        cards:
          - type: heading
            heading: Letzter Alert
            heading_style: title
            icon: mdi:bell-alert-outline
          - type: entities
            title: Payload-Zusammenfassung
            show_header_toggle: false
            entities:
              - entity: input_text.argus_alert_status
                name: Status
              - entity: input_text.argus_alert_severity
                name: Severity
              - entity: input_text.argus_alert_name
                name: Alertname
              - entity: input_text.argus_alert_instance
                name: Instance
              - entity: input_text.argus_alert_summary
                name: Summary
          - type: markdown
            content: >
              ## Argus Alertmanager

              **Status:** {{ states('input_text.argus_alert_status') }}

              **Alert:** {{ states('input_text.argus_alert_name') }}

              **Severity:** {{ states('input_text.argus_alert_severity') }}

              **Instance:** {{ states('input_text.argus_alert_instance') }}

              **Summary:** {{ states('input_text.argus_alert_summary') }}

              **Letzter Eingang:** {{ states('input_datetime.argus_last_alert_at') }}

              Diese View ist passiv: keine HA-Notification, keine Geräte-/Haussteuerung.

  - title: Ventilatoren
    path: ventilatoren
    icon: mdi:fan
    type: sections
    max_columns: 3
    badges: []
    sections:
      - type: grid
        cards:
          - type: custom:mushroom-template-card
            primary: Lüftungsempfehlung
            secondary: >
              {% set auto = is_state('input_boolean.ventilatoren_empfehlung_aktiv','on') %}
              {% set aussen = states('sensor.gw2000a_outdoor_temperature')|float(none) %}
              {% set og = states('sensor.haus_og_temperatur')|float(none) %}
              {% set eg = states('sensor.haus_eg_temperatur')|float(none) %}
              {% set og_delta = states('sensor.haus_og_aussen_temperatur_delta')|float(none) %}
              {% set eg_delta = states('sensor.haus_eg_aussen_temperatur_delta')|float(none) %}
              {% set og_min = states('input_number.ventilator_og_min')|float(24) %}
              {% set delta_min = states('input_number.ventilator_delta_min')|float(1.5) %}
              {% set eg_min = states('input_number.ventilator_eg_min')|float(24) %}
              {% set a_max = states('input_number.ventilator_aussen_max')|float(24) %}
              {% if not auto %}Empfehlung ist ausgeschaltet.
              {% elif aussen is none or og is none or eg is none %}Daten unvollständig – bitte warten.
              {% elif aussen > a_max %}Fenster zu halten: Außen {{ aussen|round(1) }} °C ist zu warm.
              {% elif og is not none and og >= og_min and og_delta is not none and og_delta >= delta_min and eg is not none and eg >= eg_min and eg_delta is not none and eg_delta >= delta_min %}Jetzt lüften + alle Fans unterstützen.
              {% elif og is not none and og >= og_min and og_delta is not none and og_delta >= delta_min %}OG lüften – Tower-Fan verteilt die Luft.
              {% elif eg is not none and eg >= eg_min and eg_delta is not none and eg_delta >= delta_min %}EG lüften – Desktop-Fans unterstützen.
              {% else %}Alles entspannt. Keine Aktion nötig.
              {% endif %}
            icon: >
              {% set auto = is_state('input_boolean.ventilatoren_empfehlung_aktiv','on') %}
              {% set aussen = states('sensor.gw2000a_outdoor_temperature')|float(none) %}
              {% set og = states('sensor.haus_og_temperatur')|float(none) %}
              {% set eg = states('sensor.haus_eg_temperatur')|float(none) %}
              {% set og_delta = states('sensor.haus_og_aussen_temperatur_delta')|float(none) %}
              {% set eg_delta = states('sensor.haus_eg_aussen_temperatur_delta')|float(none) %}
              {% set og_min = states('input_number.ventilator_og_min')|float(24) %}
              {% set delta_min = states('input_number.ventilator_delta_min')|float(1.5) %}
              {% set eg_min = states('input_number.ventilator_eg_min')|float(24) %}
              {% set a_max = states('input_number.ventilator_aussen_max')|float(24) %}
              {% if not auto %}mdi:fan-off
              {% elif aussen is none or og is none or eg is none %}mdi:fan-alert
              {% elif aussen > a_max %}mdi:window-closed-variant
              {% elif og is not none and og >= og_min and og_delta is not none and og_delta >= delta_min %}mdi:fan-auto
              {% elif eg is not none and eg >= eg_min and eg_delta is not none and eg_delta >= delta_min %}mdi:fan-auto
              {% else %}mdi:fan-check{% endif %}
            color: >
              {% set auto = is_state('input_boolean.ventilatoren_empfehlung_aktiv','on') %}
              {% set aussen = states('sensor.gw2000a_outdoor_temperature')|float(none) %}
              {% set og = states('sensor.haus_og_temperatur')|float(none) %}
              {% set eg = states('sensor.haus_eg_temperatur')|float(none) %}
              {% set og_delta = states('sensor.haus_og_aussen_temperatur_delta')|float(none) %}
              {% set eg_delta = states('sensor.haus_eg_aussen_temperatur_delta')|float(none) %}
              {% set og_min = states('input_number.ventilator_og_min')|float(24) %}
              {% set delta_min = states('input_number.ventilator_delta_min')|float(1.5) %}
              {% set eg_min = states('input_number.ventilator_eg_min')|float(24) %}
              {% set a_max = states('input_number.ventilator_aussen_max')|float(24) %}
              {% if not auto %}grey
              {% elif aussen is none or og is none or eg is none %}amber
              {% elif aussen > a_max %}red
              {% elif og is not none and og >= og_min and og_delta is not none and og_delta >= delta_min %}green
              {% elif eg is not none and eg >= eg_min and eg_delta is not none and eg_delta >= delta_min %}green
              {% else %}blue{% endif %}
            vertical: true
            multiline_secondary: true
          - type: custom:mushroom-entity-card
            entity: input_boolean.ventilatoren_empfehlung_aktiv
            name: Empfehlung an
            icon_color: teal
          - type: custom:mushroom-entity-card
            entity: input_boolean.hitzetag_erwartet
            name: Hitzetag
            icon_color: amber
          - type: custom:mushroom-entity-card
            entity: sensor.gw2000a_outdoor_temperature
            name: Außen
            icon_color: green
      - type: grid
        cards:
          - type: heading
            heading: Schlafzimmer / OG
            heading_style: title
            icon: mdi:bed
          - type: custom:mushroom-fan-card
            entity: fan.xiaomi_tower_schlafzimmer
            name: Tower Schlafzimmer
            icon_animation: true
            show_percentage_control: true
            show_oscillate_control: true
          - type: custom:mushroom-fan-card
            entity: fan.luftfilter_schlafzimmer
            name: Luftfilter Schlafzimmer
            show_percentage_control: true
          - type: custom:mushroom-template-card
            entity: binary_sensor.fenster_schlafzimmer_bett_seite_contact
            icon: >
              {% if is_state(entity, 'on') %}mdi:window-open-variant{% else %}mdi:window-closed-variant{% endif %}
            color: >
              {% if is_state(entity, 'on') %}green{% else %}grey{% endif %}
            primary: >
              {% if is_state(entity, 'on') %}Offen{% else %}Geschlossen{% endif %}
            secondary: Bett-Seite
            vertical: true
          - type: custom:mushroom-template-card
            entity: binary_sensor.fenster_schlafzimmer_tur_seite_contact
            icon: >
              {% if is_state(entity, 'on') %}mdi:window-open-variant{% else %}mdi:window-closed-variant{% endif %}
            color: >
              {% if is_state(entity, 'on') %}green{% else %}grey{% endif %}
            primary: >
              {% if is_state(entity, 'on') %}Offen{% else %}Geschlossen{% endif %}
            secondary: Tür-Seite
            vertical: true
      - type: grid
        cards:
          - type: heading
            heading: EG / tagsüber
            heading_style: title
            icon: mdi:home-floor-0
          - type: custom:mushroom-fan-card
            entity: fan.xiaomi_desktop_office
            name: Desktop Office
            icon_animation: true
            show_percentage_control: true
            show_oscillate_control: true
          - type: custom:mushroom-fan-card
            entity: fan.xiaomi_desktop_kueche
            name: Desktop Küche
            icon_animation: true
            show_percentage_control: true
            show_oscillate_control: true
          - type: custom:mushroom-entity-card
            entity: sensor.haus_eg_temperatur
            name: EG Temperatur
            icon_color: orange
          - type: custom:mushroom-entity-card
            entity: sensor.haus_eg_aussen_temperatur_delta
            name: EG wärmer als außen
            icon_color: blue
      - type: grid
        cards:
          - type: heading
            heading: Wohnzimmer / Luftqualität
            heading_style: title
            icon: mdi:sofa
          - type: custom:mushroom-fan-card
            entity: fan.luftfilter_wohnzimmer
            name: Luftfilter Wohnzimmer
            show_percentage_control: true
          - type: custom:mushroom-entity-card
            entity: sensor.luftfilter_wohnzimmer_pm25

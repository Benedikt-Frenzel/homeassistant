            heading_style: title
            icon: mdi:home-floor-0
          - type: tile
            entity: sensor.haus_eg_temperatur
            name: EG Durchschnitt
            color: blue
          - type: tile
            entity: sensor.haus_eg_luftfeuchte
            name: EG Feuchte
            color: cyan
          - type: tile
            entity: sensor.haus_eg_aussen_temperatur_delta
            name: EG wärmer als außen
            color: orange
          - type: entities
            title: EG Einzelwerte
            entities:
              - entity: sensor.temp_feucht_flur_temperature
                name: Flur Temperatur
              - entity: sensor.temp_feucht_flur_humidity
                name: Flur Feuchte
              - entity: sensor.temp_feucht_bad_wanne_temperature
                name: Bad Temperatur
              - entity: sensor.temp_feucht_bad_wanne_humidity
                name: Bad Feuchte
      - type: grid
        cards:
          - type: heading
            heading: Obergeschoss
            heading_style: title
            icon: mdi:home-floor-1
          - type: tile
            entity: sensor.haus_og_temperatur
            name: OG Durchschnitt
            color: orange
          - type: tile
            entity: sensor.haus_og_luftfeuchte
            name: OG Feuchte
            color: cyan
          - type: tile
            entity: sensor.haus_og_aussen_temperatur_delta
            name: OG wärmer als außen
            color: amber
          - type: entities
            title: OG Einzelwerte
            entities:
              - entity: sensor.gw2000a_indoor_temperature
                name: Büro Temperatur
              - entity: sensor.gw2000a_indoor_humidity
                name: Büro Feuchte
              - entity: sensor.temp_feucht_schlafzimmer_temperature
                name: Schlafzimmer Temperatur
              - entity: sensor.temp_feucht_schlafzimmer_humidity
                name: Schlafzimmer Feuchte
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Verlauf
            heading_style: title
            icon: mdi:chart-line
          - type: history-graph
            title: 24h Temperatur Zonen
            hours_to_show: 24
            entities:
              - entity: sensor.gw2000a_outdoor_temperature
                name: Außen
              - entity: sensor.haus_eg_temperatur
                name: EG
              - entity: sensor.haus_og_temperatur
                name: OG
          - type: history-graph
            title: 24h Räume
            hours_to_show: 24
            entities:
              - entity: sensor.gw2000a_indoor_temperature
                name: Büro
              - entity: sensor.temp_feucht_schlafzimmer_temperature
                name: Schlafzimmer
              - entity: sensor.temp_feucht_bad_wanne_temperature
                name: Bad
              - entity: sensor.temp_feucht_flur_temperature
                name: Flur

  - title: Keller
    path: keller
    icon: mdi:home-floor-negative-1
    type: sections
    max_columns: 2
    badges: []
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Kellerklima
            heading_style: title
            icon: mdi:water-percent-alert
          - type: markdown
            content: >
              {% set h = states('sensor.haus_keller_luftfeuchte')|float(none) %}
              # 💧 Keller Feuchte

              {% if h is none %}
              Noch keine Keller-Feuchte verfügbar.
              {% elif h >= 70 %}
              **Kritisch:** {{ h|round(1) }} %. Lüften/Entfeuchten prüfen.
              {% elif h >= 60 %}
              **Beobachten:** {{ h|round(1) }} %. Keller im Auge behalten.
              {% else %}
              **OK:** {{ h|round(1) }} %. Kellerfeuchte unauffällig.
              {% endif %}
          - type: tile
            entity: sensor.haus_keller_luftfeuchte
            name: Keller Durchschnitt Feuchte
            color: cyan
          - type: tile
            entity: sensor.haus_keller_temperatur
            name: Keller Durchschnitt Temperatur
            color: blue
          - type: tile
            entity: sensor.haus_keller_feuchte_warnung
            name: Feuchte Bewertung
            color: amber
      - type: grid
        cards:
          - type: heading
            heading: Einzelwerte
            heading_style: title
            icon: mdi:home-floor-negative-1
          - type: entities
            title: Keller klein / groß
            show_header_toggle: false
            entities:
              - entity: sensor.temp_feucht_keller_klein_temperature
                name: Keller klein Temperatur
              - entity: sensor.temp_feucht_keller_klein_humidity
                name: Keller klein Feuchte
              - entity: sensor.temp_feucht_keller_gross_temperature
                name: Keller groß Temperatur
              - entity: sensor.temp_feucht_keller_gross_humidity
                name: Keller groß Feuchte
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Verlauf
            heading_style: title
            icon: mdi:chart-line
          - type: history-graph
            title: 48h Keller Feuchte
            hours_to_show: 48
            entities:
              - entity: sensor.haus_keller_luftfeuchte
                name: Durchschnitt
              - entity: sensor.temp_feucht_keller_klein_humidity
                name: Keller klein
              - entity: sensor.temp_feucht_keller_gross_humidity
                name: Keller groß
          - type: history-graph
            title: 48h Keller Temperatur
            hours_to_show: 48
            entities:
              - entity: sensor.haus_keller_temperatur
                name: Durchschnitt
              - entity: sensor.temp_feucht_keller_klein_temperature
                name: Keller klein
              - entity: sensor.temp_feucht_keller_gross_temperature
                name: Keller groß


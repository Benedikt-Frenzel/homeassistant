  icon: mdi:home-floor-negative-1
  type: sections
  max_columns: 2
  badges:
  - entity: sensor.haus_keller_luftfeuchte
    name: Keller
  sections:
  - type: grid
    cards:
    - type: custom:mushroom-template-card

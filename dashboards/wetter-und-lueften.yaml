title: Wetter & Lüften
views:
  - title: Heute
    path: heute
    icon: mdi:weather-sunny-alert
    type: sections
    max_columns: 3
    badges: []
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Heute lüften?
            heading_style: title
            icon: mdi:window-open-variant
          - type: markdown
            content: >
              {% set hitze = is_state('input_boolean.hitzetag_erwartet','on') %}
              {% set aussen = states('sensor.gw2000a_outdoor_temperature')|float(none) %}
              {% set og = states('sensor.haus_og_temperatur')|float(none) %}
              {% set delta = states('sensor.haus_og_aussen_temperatur_delta')|float(none) %}
              {% set bett = is_state('binary_sensor.fenster_schlafzimmer_bett_seite_contact','on') %}
              {% set tuer = is_state('binary_sensor.fenster_schlafzimmer_tur_seite_contact','on') %}
              # 🌿 Empfehlung

              {% if hitze and delta is not none and delta > 1 and not bett and not tuer %}
              **OG lüften lohnt.** Draußen ist es {{ delta|round(1) }} °C kühler als oben.
              {% elif hitze and aussen is not none and aussen > 20 and (bett or tuer) %}
              **Fenster schließen.** Draußen sind es {{ aussen|round(1) }} °C.
              {% elif hitze %}
              **Hitzetag aktiv.** Fensterstatus und Temperatur weiter beobachten.
              {% else %}
              **Kein Hitzetag aktiv.** Normal lüften nach Gefühl.
              {% endif %}
          - type: tile
            entity: input_boolean.hitzetag_erwartet
            name: Hitzetag
            icon: mdi:white-balance-sunny
            color: amber
          - type: tile
            entity: sensor.gw2000a_outdoor_temperature
            name: Außen
            icon: mdi:thermometer
            color: green
          - type: tile
            entity: sensor.haus_eg_temperatur
            name: EG
            icon: mdi:home-floor-0
            color: blue
          - type: tile
            entity: sensor.haus_og_temperatur
            name: OG
            icon: mdi:home-floor-1
            color: orange
          - type: tile
            entity: sensor.haus_keller_luftfeuchte
            name: Keller Feuchte
            icon: mdi:water-percent-alert
            color: cyan
      - type: grid
        cards:
          - type: heading
            heading: Wetter
            heading_style: title
            icon: mdi:weather-partly-cloudy
          - type: weather-forecast
            entity: weather.forecast_home
            name: Wetterbericht
            forecast_type: daily
            show_forecast: true
          - type: entities
            title: Schwellen
            show_header_toggle: false
            entities:
              - entity: input_number.hitzetag_schwelle_max
                name: Hitzetag ab
              - entity: input_number.hitzetag_lueften_morgens_unter
                name: Morgens lüften unter
              - entity: input_number.hitzetag_fenster_schliessen_ab
                name: Fenster schließen ab
              - entity: input_number.hitzetag_lueften_delta
                name: Lüften Delta
      - type: grid
        cards:
          - type: heading
            heading: Schlafzimmerfenster
            heading_style: title
            icon: mdi:window-closed-variant
          - type: tile
            entity: binary_sensor.fenster_schlafzimmer_bett_seite_contact
            name: Bett-Seite
            icon: mdi:window-closed-variant
          - type: tile
            entity: binary_sensor.fenster_schlafzimmer_tur_seite_contact
            name: Tür-Seite
            icon: mdi:window-closed-variant
          - type: entities
            title: Automationen
            show_header_toggle: false
            entities:
              - entity: automation.hitzetag_forecast_helper_aktualisieren
                name: Forecast Helper
              - entity: automation.hitzetag_morgens_luften
                name: Morgens lüften
              - entity: automation.hitzetag_fenster_schliessen
                name: Fenster schließen
              - entity: automation.hitzetag_abends_og_luften
                name: Abends OG lüften

  - title: Hausklima
    path: hausklima
    icon: mdi:home-thermometer
    type: sections
    max_columns: 2
    badges: []
    sections:

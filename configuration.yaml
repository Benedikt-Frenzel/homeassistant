# Home Assistant configuration managed by ha-packages repo.
# Minimal base config, because Git Pull add-on checks out into /config.

default_config:

homeassistant:
  external_url: https://ha.bfr.sh
  internal_url: http://10.12.99.41:8123
  packages: !include_dir_named packages

http:
  use_x_forwarded_for: true
  trusted_proxies:
    # Internal reverse proxy
    - 10.12.40.30
    # Colossus site-to-site WireGuard peer
    - 10.255.130.2

# Prometheus integration: exposes /api/prometheus for the argus scrape job.
# See ../infra argus host_vars (HA_ARGUS_PROMETHEUS_TOKEN_B64) and the
# `homeassistant` job in roles/observability_stack/templates/prometheus.yml.j2.
# The endpoint authenticates with a long-lived access token for pi.ai-admin.
prometheus:

google_assistant:
  project_id: smarthome-test-84780
  service_account: !include smarthome-test-84780-0865b5d2c6af.json
  report_state: true
  expose_by_default: true
  exposed_domains:
    - binary_sensor
    - fan
    - input_boolean
    - light
    - media_player
    - sensor
    - switch
    - weather

lovelace:
  mode: storage
  dashboards:
    argus-dashboard:
      mode: yaml
      title: Argus
      icon: mdi:monitor-dashboard
      show_in_sidebar: true
      filename: dashboards/argus.yaml
    wetter-und-lueften:
      mode: yaml
      title: Wetter & Lüften
      icon: mdi:weather-partly-cloudy
      show_in_sidebar: true
      filename: dashboards/wetter-und-lueften.yaml

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
